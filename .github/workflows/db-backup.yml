# Nightly encrypted backup of the production database (Neon) and of every
# uploaded image it references (Vercel Blob / Cloudinary).
#
# Neon's free plan only keeps 6 hours of history, so this keeps a daily
# copy for 30 days. The archive is encrypted (AES-256, gpg) with
# BACKUP_PASSPHRASE before upload — this repository is public, so an
# unencrypted artifact would be readable by anyone.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   DATABASE_URL       Neon *direct* (non-pooler) connection string
#   BACKUP_PASSPHRASE  long random password — keep a copy somewhere safe,
#                      without it the backups cannot be opened
#
# Restore: download the artifact from the workflow run (it's a .zip holding
# the .gpg file), then
#   gpg --batch --passphrase "<passphrase>" -d artqala-YYYY-MM-DD.tar.gz.gpg | tar -xzf -
# which gives database.sql, image-urls.txt and images/<host>/<path> —
#   psql "<target DATABASE_URL>" -f database.sql
# and re-upload images/ to the same paths if the image storage was lost.
name: Database backup

on:
  schedule:
    - cron: '0 1 * * *' # 01:00 UTC = 06:00 Tashkent, daily
  workflow_dispatch: {} # "Run workflow" button for a manual backup

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::DATABASE_URL and BACKUP_PASSPHRASE repository secrets must be set."
            exit 1
          fi
          # Neon's "Copy snippet" can include extra text around the address
          # (psql '...', DATABASE_URL=..., quotes) — pull out just the
          # postgresql://... connection string. It's masked in the logs and
          # handed to the next steps as DB_URL.
          DB_URL=$(printf '%s' "$DATABASE_URL" | grep -oE "postgres(ql)?://[^'\"[:space:]]+" | head -n 1 || true)
          if [ -z "$DB_URL" ]; then
            echo "::error::No postgresql://... address found in DATABASE_URL. In Neon: Connect → Connection pooling off → Show password → copy the connection string."
            exit 1
          fi
          echo "::add-mask::$DB_URL"
          if printf '%s' "$DB_URL" | grep -q '\*\*\*'; then
            echo "::error::DATABASE_URL contains a masked password (****). In Neon click 'Show password' and copy again."; exit 1
          fi
          if printf '%s' "$DB_URL" | grep -q -- '-pooler'; then
            echo "::error::DATABASE_URL is the pooled connection (-pooler). In Neon turn Connection pooling OFF and copy again."; exit 1
          fi
          echo "DB_URL=$DB_URL" >> "$GITHUB_ENV"

      - name: Install a pg_dump matching the server version
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common > /dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y > /dev/null
          # psql from any version can ask the server which major version it runs
          sudo apt-get install -y -qq postgresql-client > /dev/null
          if ! MAJOR=$(psql "$DB_URL" -tAc "SELECT current_setting('server_version_num')::int / 10000" 2>/tmp/psql.err); then
            echo "::error::Could not connect to the database: $(tr -s '[:space:]' ' ' < /tmp/psql.err)"
            exit 1
          fi
          echo "Server major version: $MAJOR"
          sudo apt-get install -y -qq "postgresql-client-$MAJOR" > /dev/null
          echo "PG_BIN=/usr/lib/postgresql/$MAJOR/bin" >> "$GITHUB_ENV"

      - name: Dump database and download images
        run: |
          set -o pipefail
          mkdir -p backup/images
          "$PG_BIN/pg_dump" "$DB_URL" --no-owner --no-privileges > backup/database.sql
          # Every uploaded image (paintings, artists, ...) is referenced by URL
          # somewhere in the database — collect those URLs from the dump and
          # save the files, so a restore brings the photos back too.
          grep -oE 'https://[A-Za-z0-9.-]+\.(public\.blob\.vercel-storage\.com|res\.cloudinary\.com)/[A-Za-z0-9._~%/+=-]+' \
            backup/database.sql | sort -u > backup/image-urls.txt || true
          FAILED=0
          while read -r url; do
            dest="backup/images/${url#https://}"
            mkdir -p "$(dirname "$dest")"
            curl -fsSL --retry 2 --max-time 60 -o "$dest" "$url" || { echo "::warning::Could not download $url"; FAILED=$((FAILED + 1)); }
          done < backup/image-urls.txt
          echo "Images: $(wc -l < backup/image-urls.txt) referenced, $FAILED failed, $(du -sh backup/images | cut -f1) downloaded"

      - name: Compress and encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -o pipefail
          FILE="artqala-$(date -u +%Y-%m-%d).tar.gz.gpg"
          tar -czf - -C backup . \
            | gpg --batch --yes --symmetric --cipher-algo AES256 \
                  --passphrase "$BACKUP_PASSPHRASE" -o "$FILE"
          rm -rf backup
          ls -lh "$FILE"
          echo "BACKUP_FILE=$FILE" >> "$GITHUB_ENV"

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
          if-no-files-found: error
